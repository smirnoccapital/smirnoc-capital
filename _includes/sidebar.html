<aside class="site-sidebar">
  <div class="sidebar-widget futures-card" id="widget-grains"></div>
  <div class="sidebar-widget futures-card" id="widget-fertilizer"></div>
  <div class="sidebar-widget futures-card" id="widget-energy"></div>

  <script>
    (function () {
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var W = 260, H = 140;
      var PAD = { left: 34, right: 6, top: 10, bottom: 18 };
      var plotW = W - PAD.left - PAD.right;
      var plotH = H - PAD.top - PAD.bottom;

      var WIDGETS = [
        {
          id: 'widget-grains',
          title: 'US Grain Futures',
          series: [
            { key: 'corn', color: '#2a78d6' },
            { key: 'soybeans', color: '#eb6834' },
            { key: 'soymeal', color: '#1baf7a' },
            { key: 'soyoil', color: '#eda100' },
            { key: 'wheat', color: '#e87ba4' }
          ]
        },
        {
          id: 'widget-fertilizer',
          title: 'Fertilizer',
          note: 'Urea only — no CME-tracked feed exists for DAP or potash.',
          series: [
            { key: 'urea', color: '#2a78d6' }
          ]
        },
        {
          id: 'widget-energy',
          title: 'Energy',
          series: [
            { key: 'crude', color: '#2a78d6' },
            { key: 'diesel', color: '#eb6834' }
          ]
        }
      ];

      var quotesByKey = {};
      var historyByKey = {};
      var dataUpdated = null;

      function fmt(v, decimals) {
        if (v == null) { return '—'; }
        return v.toFixed(decimals != null ? decimals : 2);
      }

      function el(tag, attrs) {
        var node = document.createElementNS(SVG_NS, tag);
        for (var k in attrs) { node.setAttribute(k, attrs[k]); }
        return node;
      }

      function buildWidget(widgetConfig) {
        var root = document.getElementById(widgetConfig.id);
        if (!root) { return; }

        var colorByKey = {};
        widgetConfig.series.forEach(function (s) { colorByKey[s.key] = s.color; });

        var state = { activeKey: widgetConfig.series[0].key, showingTable: false };

        root.innerHTML = '';

        var h4 = document.createElement('h4');
        h4.textContent = widgetConfig.title;
        root.appendChild(h4);

        if (widgetConfig.note) {
          var note = document.createElement('p');
          note.className = 'futures-note';
          note.textContent = widgetConfig.note;
          root.appendChild(note);
        }

        var list = document.createElement('ul');
        list.className = 'futures-list';
        root.appendChild(list);

        var chartSection = document.createElement('div');
        chartSection.className = 'futures-chart-section';
        root.appendChild(chartSection);

        var tabsEl = document.createElement('div');
        tabsEl.className = 'futures-tabs';
        tabsEl.setAttribute('role', 'tablist');
        tabsEl.setAttribute('aria-label', 'Select commodity chart');
        if (widgetConfig.series.length > 1) { chartSection.appendChild(tabsEl); }

        var chartWrap = document.createElement('div');
        chartWrap.className = 'futures-chart-wrap';
        chartSection.appendChild(chartWrap);

        var svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.setAttribute('role', 'img');
        chartWrap.appendChild(svg);

        var tooltip = document.createElement('div');
        tooltip.className = 'futures-tooltip';
        tooltip.hidden = true;
        chartWrap.appendChild(tooltip);

        var chartMsg = document.createElement('p');
        chartMsg.className = 'futures-chart-msg';
        chartMsg.hidden = true;
        chartWrap.appendChild(chartMsg);

        var tableToggle = document.createElement('button');
        tableToggle.type = 'button';
        tableToggle.className = 'futures-table-toggle';
        tableToggle.textContent = 'View as table';
        chartSection.appendChild(tableToggle);

        var summaryEl = document.createElement('dl');
        summaryEl.className = 'futures-summary';
        summaryEl.hidden = true;
        chartSection.appendChild(summaryEl);

        var updated = document.createElement('p');
        updated.className = 'futures-updated';
        root.appendChild(updated);

        function renderList() {
          list.innerHTML = '';
          var any = false;

          widgetConfig.series.forEach(function (s) {
            var q = quotesByKey[s.key];
            if (!q || q.price == null) { return; }
            any = true;

            var changeClass = 'flat';
            var changeSign = '';
            if (q.change > 0) { changeClass = 'up'; changeSign = '+'; }
            else if (q.change < 0) { changeClass = 'down'; }

            var li = document.createElement('li');
            li.className = 'futures-row';

            var dot = document.createElement('span');
            dot.className = 'futures-dot';
            dot.style.background = s.color;

            var label = document.createElement('span');
            label.className = 'futures-label';
            label.append(dot, document.createTextNode(q.label));

            var price = document.createElement('span');
            price.className = 'futures-price';
            var small = document.createElement('small');
            small.textContent = q.unit;
            price.append(document.createTextNode(fmt(q.price, q.decimals) + ' '), small);

            var change = document.createElement('span');
            change.className = 'futures-change ' + changeClass;
            if (q.change != null) {
              change.textContent = changeSign + q.change.toFixed(q.decimals != null ? q.decimals : 2) +
                ' (' + changeSign + q.change_pct.toFixed(1) + '%)';
            }

            li.append(label, price, change);
            list.appendChild(li);
          });

          if (!any) {
            list.innerHTML = '<li class="futures-row futures-loading">Prices unavailable</li>';
          }
        }

        function renderTabs() {
          if (widgetConfig.series.length <= 1) { return; }
          tabsEl.innerHTML = '';
          widgetConfig.series.forEach(function (s) {
            var q = quotesByKey[s.key];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'futures-tab' + (s.key === state.activeKey ? ' active' : '');
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-selected', s.key === state.activeKey ? 'true' : 'false');
            btn.style.setProperty('--dot-color', s.color);
            btn.textContent = q ? q.label.replace('Soybean ', '') : s.key;
            btn.addEventListener('click', function () {
              if (state.activeKey === s.key) { return; }
              state.activeKey = s.key;
              renderTabs();
              renderChart(state.activeKey);
              if (state.showingTable) { renderSummary(state.activeKey); }
            });
            tabsEl.appendChild(btn);
          });
        }

        function clearSvg() {
          while (svg.lastChild) { svg.removeChild(svg.lastChild); }
        }

        function renderChart(key) {
          clearSvg();
          chartMsg.hidden = true;
          tooltip.hidden = true;

          var q = quotesByKey[key];
          var hist = historyByKey[key];
          var color = colorByKey[key];
          var decimals = q ? q.decimals : 2;
          var unit = q ? q.unit : '';

          var title = el('title', {});
          title.textContent = (q ? q.label : key) + ': 1-year daily closing price';
          svg.appendChild(title);
          svg.setAttribute('aria-label', title.textContent);

          if (!hist || !hist.closes || hist.closes.length < 2) {
            chartMsg.textContent = 'History unavailable yet';
            chartMsg.hidden = false;
            return;
          }

          var closes = hist.closes, dates = hist.dates;
          var n = closes.length;
          var min = Math.min.apply(null, closes);
          var max = Math.max.apply(null, closes);
          if (min === max) { min -= 1; max += 1; }

          function x(i) { return PAD.left + (i / (n - 1)) * plotW; }
          function y(v) { return PAD.top + (1 - (v - min) / (max - min)) * plotH; }

          var mid = (min + max) / 2;
          [min, mid, max].forEach(function (v) {
            svg.appendChild(el('line', {
              x1: PAD.left, x2: W - PAD.right, y1: y(v), y2: y(v),
              stroke: '#e1e0d9', 'stroke-width': 1
            }));
            var label = el('text', { x: 2, y: y(v) + 3, 'font-size': 9, fill: '#898781' });
            label.textContent = fmt(v, decimals);
            svg.appendChild(label);
          });

          var d = closes.map(function (v, i) {
            return (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1);
          }).join(' ');
          svg.appendChild(el('path', {
            d: d, fill: 'none', stroke: color, 'stroke-width': 2,
            'stroke-linejoin': 'round', 'stroke-linecap': 'round'
          }));

          svg.appendChild(el('circle', {
            cx: x(n - 1), cy: y(closes[n - 1]), r: 4, fill: color,
            stroke: '#fff', 'stroke-width': 2
          }));

          [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i, idx) {
            var anchor = idx === 0 ? 'start' : (idx === 1 ? 'middle' : 'end');
            var xpos = x(i);
            if (idx === 0) { xpos += 1; }
            if (idx === 2) { xpos -= 1; }
            var label = el('text', { x: xpos, y: H - 4, 'font-size': 9, fill: '#898781', 'text-anchor': anchor });
            label.textContent = new Date(dates[i]).toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
            svg.appendChild(label);
          });

          var hoverLine = el('line', { x1: 0, x2: 0, y1: PAD.top, y2: H - PAD.bottom, stroke: '#c3c2b7', 'stroke-width': 1, visibility: 'hidden' });
          var hoverDot = el('circle', { r: 4, fill: color, stroke: '#fff', 'stroke-width': 2, visibility: 'hidden' });
          svg.appendChild(hoverLine);
          svg.appendChild(hoverDot);

          var hitRect = el('rect', { x: PAD.left, y: 0, width: plotW, height: H, fill: 'transparent' });
          svg.appendChild(hitRect);

          function handleMove(evt) {
            var rect = svg.getBoundingClientRect();
            var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            var vx = (clientX - rect.left) / rect.width * W;
            var idx = Math.round((vx - PAD.left) / plotW * (n - 1));
            idx = Math.max(0, Math.min(n - 1, idx));

            var px = x(idx), py = y(closes[idx]);
            hoverLine.setAttribute('x1', px);
            hoverLine.setAttribute('x2', px);
            hoverLine.setAttribute('visibility', 'visible');
            hoverDot.setAttribute('cx', px);
            hoverDot.setAttribute('cy', py);
            hoverDot.setAttribute('visibility', 'visible');

            var wrapRect = chartWrap.getBoundingClientRect();
            var pxClient = rect.left + (px / W) * rect.width;
            tooltip.style.left = Math.max(4, Math.min(rect.width - 90, pxClient - wrapRect.left - 45)) + 'px';
            tooltip.style.top = '2px';
            tooltip.innerHTML = '';
            var strong = document.createElement('strong');
            strong.textContent = fmt(closes[idx], decimals) + ' ' + unit;
            var span = document.createElement('span');
            span.textContent = new Date(dates[idx]).toLocaleDateString();
            tooltip.append(strong, span);
            tooltip.hidden = false;
          }

          function handleLeave() {
            hoverLine.setAttribute('visibility', 'hidden');
            hoverDot.setAttribute('visibility', 'hidden');
            tooltip.hidden = true;
          }

          hitRect.addEventListener('pointermove', handleMove);
          hitRect.addEventListener('pointerleave', handleLeave);
        }

        function renderSummary(key) {
          var q = quotesByKey[key];
          var hist = historyByKey[key];
          var decimals = q ? q.decimals : 2;
          var unit = q ? q.unit : '';
          summaryEl.innerHTML = '';

          if (!hist || !hist.closes || !hist.closes.length) {
            summaryEl.textContent = 'History unavailable yet.';
            return;
          }

          var closes = hist.closes;
          var first = closes[0], last = closes[closes.length - 1];
          var high = Math.max.apply(null, closes);
          var low = Math.min.apply(null, closes);
          var pctChange = ((last - first) / first) * 100;

          [
            ['1Y high', fmt(high, decimals) + ' ' + unit],
            ['1Y low', fmt(low, decimals) + ' ' + unit],
            ['1Y change', (pctChange >= 0 ? '+' : '') + pctChange.toFixed(1) + '%'],
            ['Latest', fmt(last, decimals) + ' ' + unit]
          ].forEach(function (pair) {
            var dt = document.createElement('dt');
            dt.textContent = pair[0];
            var dd = document.createElement('dd');
            dd.textContent = pair[1];
            summaryEl.append(dt, dd);
          });
        }

        tableToggle.addEventListener('click', function () {
          state.showingTable = !state.showingTable;
          tableToggle.textContent = state.showingTable ? 'View as chart' : 'View as table';
          chartWrap.hidden = state.showingTable;
          summaryEl.hidden = !state.showingTable;
          if (state.showingTable) { renderSummary(state.activeKey); }
        });

        return {
          refresh: function () {
            renderList();
            renderTabs();
            renderChart(state.activeKey);
            if (dataUpdated) {
              updated.textContent = 'Updated ' + new Date(dataUpdated).toLocaleString();
            }
          }
        };
      }

      var instances = WIDGETS.map(buildWidget);

      function refreshAll() {
        instances.forEach(function (w) { if (w) { w.refresh(); } });
      }

      function loadQuotes() {
        return fetch('{{ "/assets/data/futures.json" | relative_url }}', { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            quotesByKey = data.quotes || {};
            dataUpdated = data.updated || dataUpdated;
            refreshAll();
          })
          .catch(function () { /* keep prior state visible */ });
      }

      function loadHistory() {
        return fetch('{{ "/assets/data/futures_history.json" | relative_url }}', { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            historyByKey = data.history || {};
            refreshAll();
          })
          .catch(function () { /* charts show "history unavailable" */ });
      }

      loadQuotes().then(loadHistory);
    })();
  </script>

  <style>
    .futures-card {
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 20px;
      background: #fff;
      margin-bottom: 1.5rem;
    }
    .futures-card h4 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #0f1424;
    }
    .futures-note {
      margin: -6px 0 12px;
      font-size: 11px;
      color: #898781;
    }
    .futures-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .futures-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px solid #f0f1f3;
      font-size: 13px;
    }
    .futures-row:first-child {
      border-top: none;
    }
    .futures-label {
      color: #333;
      font-weight: 600;
      flex: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .futures-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .futures-price {
      color: #0f1424;
      font-weight: 600;
      white-space: nowrap;
    }
    .futures-price small {
      font-weight: 400;
      color: #999;
      margin-left: 2px;
    }
    .futures-change {
      white-space: nowrap;
      font-size: 12px;
      min-width: 88px;
      text-align: right;
    }
    .futures-change.up { color: #1a7f37; }
    .futures-change.down { color: #cf222e; }
    .futures-change.flat { color: #777; }
    .futures-loading {
      color: #999;
      font-size: 13px;
      justify-content: center;
    }
    .futures-updated {
      margin: 10px 0 0;
      font-size: 11px;
      color: #999;
      text-align: right;
    }

    .futures-chart-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #f0f1f3;
    }
    .futures-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .futures-tab {
      font-size: 11px;
      font-weight: 600;
      color: #52514e;
      background: #f9f9f7;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 4px 10px 4px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .futures-tab::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dot-color, #999);
      display: inline-block;
    }
    .futures-tab.active {
      background: #0f1424;
      border-color: #0f1424;
      color: #fff;
    }
    .futures-chart-wrap {
      position: relative;
    }
    .futures-chart-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      touch-action: none;
    }
    .futures-chart-msg {
      margin: 0;
      padding: 30px 0;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
    .futures-tooltip {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      background: #0f1424;
      color: #fff;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 10px;
      pointer-events: none;
      white-space: nowrap;
      line-height: 1.3;
    }
    .futures-tooltip strong {
      font-size: 12px;
      font-weight: 700;
    }
    .futures-tooltip span {
      color: #c3c2b7;
    }
    .futures-table-toggle {
      margin-top: 8px;
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      color: #52514e;
      text-decoration: underline;
      cursor: pointer;
    }
    .futures-summary {
      margin: 10px 0 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      font-size: 12px;
    }
    .futures-summary dt {
      color: #777;
    }
    .futures-summary dd {
      margin: 0;
      font-weight: 600;
      color: #0f1424;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>

  <div class="sidebar-widget follow-card">
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title | escape }}" class="follow-card-logo">
    <h4>Smirnoc Capital</h4>
    <p>@smirnoccapital</p>
    <a href="https://x.com/smirnoccapital" target="_blank" rel="noopener" class="follow-card-btn">Follow on X</a>
  </div>

  <style>
    .follow-card {
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #fff;
    }
    .follow-card-logo {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .follow-card h4 {
      margin: 0 0 2px;
      font-size: 15px;
      color: #0f1424;
    }
    .follow-card p {
      margin: 0 0 14px;
      font-size: 13px;
      color: #777;
    }
    .follow-card-btn {
      display: inline-block;
      padding: 8px 20px;
      background: #0f1424;
      color: #fff;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .follow-card-btn:hover {
      background: #2a3352;
    }
  </style>
</aside>
